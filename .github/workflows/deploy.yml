name: Deploy trusted branches on Pi

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options: [main, dev]

permissions:
  contents: read

concurrency:
  group: finalversion-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    # This runner is privileged through Docker. Restrict this workflow to protected
    # branches and a runner group that is unavailable to public/fork PR workflows.
    runs-on: [self-hosted, finalversion]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate static documentation
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env DOTNET_CLI_HOME=/tmp \
            --volume "${GITHUB_WORKSPACE}:/src" \
            --workdir /src \
            --entrypoint /bin/sh \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            -c 'dotnet tool restore && dotnet tool run docfx docfx/docs.json && dotnet tool run docfx docfx/api.json'
      - name: Build, test, and promote local runtime
        env:
          FV_SOURCE_DIR: ${{ github.workspace }}
          TARGET: ${{ inputs.environment || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: finalversion deploy "$TARGET" "$COMMIT"
