name: .NET tests

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: dotnet-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CargoHUB.sln

      - name: Run tests
        run: dotnet test CargoHUB.sln --configuration Release --no-restore --logger "console;verbosity=normal"
